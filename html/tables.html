<!-- 
    # Tables:
        - Display data in rows and column format
        - Tags:
            - <table></table>: Wrapper tag for HTML table
            - <tr></tr>: Table row
            - <th></th>: Table header
            - <td></td>: Table data
        - Syntax:
            <table>
                <tr>
                    <th>Table hedaer 1</th>
                    <th>Table header 2</th>
                </tr>
                <tr>
                    <td>Table data 1</td>
                    <td>Table data 2</td>
                </tr>
            </table>

        - Span (Cell Merge)
            - colspan: Column Span
                - Data is same across 'n' number of columns within a single row (Horizontally)
            - rowspan: Row Span
                - Data is same across 'n' number of cells in different rows (Vertically)
-->
