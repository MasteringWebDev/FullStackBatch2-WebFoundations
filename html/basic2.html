<!DOCTYPE html>
<html lang="en">
<head>
    <title>Attributes, Lists, Links, Images</title>
</head>
<body>
    <h1>Attributes, Lists, Links, Images</h1>

    <h2>Attributes</h2>
    <img src="https://www.yourfreecareertest.com/wp-content/uploads/2016/07/What-does-a-Software-Developer-do.jpg" width="400" height="200">
    <img src="https://www.training.com.au/wp-content/uploads/Full-Stack-Developer-1.jpeg" width="400" height="200">

    <h2>Links</h2>
    <a href="https://www.w3schools.com">Go to W3Schools</a>
    <a href="https://www.facebook.com/" target="_blank">Facebook login</a>

    <h2>Lists</h2>
    <h3>My grocery list</h3>
    <ul>
        <li>Milk</li>
        <li>Eggs</li>
        <li>Bread</li>
    </ul>

    <h3>Receipe steps</h3>
    <ol>
        <li>Crack the egg</li>
        <li>Apply butter on the pan</li>
        <li>Pour it on the pan</li>
        <li>Let it cook</li>
        <li>Server and enjoy :)</li>
    </ol>
</body>
</html>

<!--
    # Attributes:
        - Additional information for HTML tags
        - Syntax: <tag attribute1="value"></tag>
        - Examples:
            - <img>
                - src (required): Source/URL of the image
                - width: Width of the image
                - height: Height of the image
                - alt: Alternate text (If image fails to load)
            - <a>
                - href (required): Hypertext reference
                - target (optional):
                    - _self (default): Load the webpage in the same tab
                    - _blank: Load the webpag in a new tab

    # Images:
        - Tag: <img>
        - Syntax: <img src="image-url" >

    # Links: 
        - Reference to another webpage
        - Tag: <a></a> (Anchor)
        - Syntax: <a href="">Link text</a>

    # Lists:
        - Display multiple items
        - Types:
            - Unordered list (ul)
            - Ordered list (ol)
        - Tags:
            - <ul></ul>: Unordered list
            - <ol></ol>: Ordered list
            - <li></li>: List item
-->
