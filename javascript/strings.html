    /*
      # Strings:
        - Can be declared with '', "", ``
        - Special characters:
          - Escape character (\)
          - Next line character (\n)
          - Tab space character (\t)

        - Position vs Index
          - Index = Position - 1
          - Examples:
            P   I
            1   0
            2   1
            3   2
            ... ...
            n   n-1
        
        - Access a specific character in a string using index
          - Syntax: str[index]

        - '+' operator works as a concatenation operator with strings
          - Eg.: firstName + ' ' + lastName

        - Properties
          - .length ***: Total number of characters
        - Methods
          - .toUpperCase(): Returns the string in upper case
          - .toLowerCase(): Returns the string in lower case
          - .indexOf() ***: Returns the index of the first occurence of the substring/character in the string, else if not found returns -1
            - .lastIndexOf(): Returns the index of the last occurence of the substring/character in the string, else if not found returns -1
          - includes() ***: Returns true if the substring/character is found in the string, else if not found returns false
          - concat(): Concatenate two or more strings
            - Alternative: '+' operator
          - charAt(index): Access a specific character in a string using index
            - Alternative: str[index]
          - slice(startIndex, endIndex) ***: Returns a substring (Ensure startIndex < endIndex)
            - startIndex, endIndex: startIndex to endIndex - 1
            - startIndex: startIndex till the end of the string
            - No arguments: Complete string
          - replace(substring/char, replaceValue): Returns a string where first occurence of the substring/character is replaced with the replaceValue provided 
            - replaceAll(substring/char, replaceValue): Returns a string where all occurences of the substring/character are replaced with the replaceValue provided 

        - Additional note:
          - To get the last character of a string
            - str[str.length - 1]

    */
