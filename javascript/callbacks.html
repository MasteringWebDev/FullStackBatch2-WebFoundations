    /*
      # Example 3: Fetch data from the server, then process that data
        1. Fetching data from the server: 7 seconds
        2. Processing that data: 5 seconds

        Total time: 7s + 5s = 12 s
    */

    function fetchData(callback) {
      console.log('FETCHING DATA FROM THE SERVER ...')

      setTimeout(() => {
        console.log('FETCHED DATA SUCCESSFULLY ✅')
        callback()
      }, 7000)
    }

    // fetchData(processData)

    fetchData(function () {
      console.log('PROCESSING DATA NOW ...')

      setTimeout(() => {

      }, 5000)
    })
