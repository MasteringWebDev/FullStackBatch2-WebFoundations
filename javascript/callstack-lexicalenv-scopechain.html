      # Call Stack, Lexical Environment, Scope Chaining
        - Call Stack: Stack data structure (LIFO - Last In First Out)
        - JS visualization tool: https://www.jsv9000.app/ 

        - Lexical Environment:
          - "Lexical" means where something is written in teh source code 
          - "Lexical environment": An environment that stores the current scope + reference to it's outer scope
            - JavaScript creates these environments based on how the code is written and nested

        - Scope chain: Used to resolve identifier values. If an identifier is not found in the current scope, JS checks it in the parent scope, if not, continues to check up the ancestor scope until the global scope
    */
