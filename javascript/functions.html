    /*
      # Functions:
        - A set/block of code which is intended to perform a particular task
        - Function can be executed as many number of times as needed
        - Advantages of functions:
          - Avoid repeated code (redundancy)/ DRY principle (Don't repeat yourself)
          - Modular code (organize code)

        - For any function to be executed in JS, it needs two steps
          1. Declaration: Only done once
            - Syntax:
              function fun1() {
                // code
              }
          2. Invocation (Calling the function): Can be done 'n' number of times
            - Syntax:
              fun1()

        - Types of functions:
          1. Standard functions
            function fun1() {
              // code
            }
          2. Anonymous functions (does not have a name, used as function expression)
            let fun1 = function () {
              // code
            }

        - Parameters and arguments
          - Can make a function dynamic (different I/P values give different O/P values)
          - Parameters: Function variables in the declaration
          - Arguments: Actual values for the function parameters passed during invocation
          - Syntax:
            function fun1(a, b) { // paramaters
              // code
            }
            fun1(10, 20) // arguments
          - Default paramaters: Default values for parameters will be applied if arguments are not provided for those paramaters
            function fun1(a = 0, b = 0) {
              // code
            }
            fun1(10, 20) // a = 10, b = 20
            fun1(10) // a = 10, b = 0
            fun1() // a = 0 , b = 0 

        - 'return' keyword:
          - Return a value at the point where the function was invoked
          - Terminates the function execution at the point where it is used
            


    */
