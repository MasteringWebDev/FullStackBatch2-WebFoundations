      # Array Higher Order Methods
        - Methods which use callback syntax

        1. forEach() ***
          - Syntax:
            arr.forEach((element) => {
              // Code which executes for each element
            })
          - Iterates through the elements of the array and executes the callback for each element
          - Callback parameters:
            1. Element
            2. Index
          - Does not return anything (undefined)
          - Does not modify the original array

        2. filter() ***
          - Syntax:
            arr.filter((element) => {
              return "condition"
            })
          - Iterates through the elements of the array and executes the callback for each element
          - Callback parameters:
            1. Element
            2. Index
          - Returns a filtered array based on the condition provided. For each element, a boolean value is returned by the callback. If true, element is added to the filtered array, else the element is skipped
          - Does not modify the original array

        3. map() ***
          - Syntax:
            arr.map((element) => {
              return "modifiedElement"
            })
          - Iterates through the elements of the array and executes the callback for each element
          - Callback parameters:
            1. Element
            2. Index
          - Returns a modified array based on the return value provided on iteration for each element
          - Does not modify the original array
