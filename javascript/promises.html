    /*
      # Promises ***: Objects that represent the eventual completion or failure of an asynchronous task
        - Properties:
          - State:
            - pending
            - fulfilled (resolved)
            - rejected
          - Result: Data tha can be passed along with resolving/rejecting a promise
        - Methods:
          - then(): Callback handles the resolved state of the promise
          - catch(): Callback handles the rejected state of the promise

        - Syntax:
          1. Creating a promise object
            const promise1 = new Promise((resolve, reject) => {
              resolve() // This promise will be resolved
              reject() // This promise will be rejected (Will be thrown as a runtime error)
            })
            - Uses the Promise contructor
            - Promise constructor takes a callback function as an argument with 2 parameters:
              - resolve(): Method to resolve the promise
              - reject(): method to reject the promise
            - With resolve/reject mathods, result data can be passed as an argument

          2. Handling a promise
            promise1
              .then(() => {
                // Logic to handle resolved state of the promise
              })
              .catch(() => {
                // Logic to handle rejected state of the promise
              })
            - Result data can be accessed as the callback parameter for .then() and .catch() methods for 'resolved' result and 'rejected' result respectively


    */
