      # Conditions:
        - Create blocks/flows which execute based on true/false condition values
        - Types:
          1. "if else" condition ***
            - Syntax:
              if(condition) {
                // Code to execute if the condition is true
              } else {
                // Code to execute if the condition is false 
              }
            - "else if": Used to additional "if conditions"
              - Syntax:
                if(condition1) {
                  // Code to execute if the condition1 is true
                } else if (condition2) {
                  // Code to execute if the condition2 is true
                } else {
                  // Code to execute if both the conditions were false 
                }

          2. "switch case" condition: Checks one variable against multiple values (cases)
            - Syntax:
              switch(variable) {
                case 'VALUE1': 
                  // code to be executed when variable == VALUE1
                  break
                case 'VALUE2': 
                  // code to be executed when variable == VALUE2
                  break
                case 'VALUE3': 
                  // code to be executed when variable == VALUE3
                  break
                ...
                default:
                  // Default code to be executed when variable != any of the above cases
              }

          3. Ternary operator (? :) 
            - "Syntactic sugar" for if else condition
            - Syntax: condition ? // code if true : // code if false
    */
