<!--
  # Javascipt:
    - Programming Language
    - Used in web development to make websites dynamic/interactive
    - Used to build Client (FE), Server (BE), Mobile applications, etc.

    - Add JavaScript to HTML
      - 'script' tag (in head/body section)
        - Internal: <script>console.log(5)</script>
        - External: <script src="index.js"></script>

    - Data types:
      - String (Eg.: 'Sharon', 'London', 'a', 'T', etc.)
      - Number (Eg.: 5, 3483492, 20.56, -638, etc.)
      - Boolean (true/false)
      - null (Empty placeholder, set manually)
      - undefined (Default value of variables)
      - Objects

    - Variables & Constants
      - Store data
        - Variables: Change over time (var)
        - Constants: Remains fixed over time (const)
      - Syntax:
        - var student = 'Sonal'
        - const pi = 3.14
      - Declare/Initialize
        - Declare: var x
        - Initialize: var x = 5
      - Assign: x = 10

    - Display output:
      - console.log(): Log anything in Broswer console
      - alert(): Alert box popup on the webpage
      - document.write(): Appends data to the HTML document
      - document.getElementById('id').innerHTML: Add html/text snippet inside an element with specified id

    - Popups:
      - alert(): Alert box
        - Inform the user
        - One button: OK
      - confirm(): Confirmation box
        - Ask the user yes/no based question
        - Two button: OK, Cancel
        - Returns: true if OK is clicked, false if Cancel is clicked
      - prompt(): Input box
        - Collect user input
        - Two button: OK, Cancel, One input text box
        - Returns: Input value if OK is clicked, null if Cancel is clicked

    - Operators: Perform operations
      - Arithmetic Operators:
        - Addition (+)
        - Subtraction (-)
        - Multiplication (*)
        - Division (/)
        - Modulus (%): Remainder
        - Increment (++): Increase value by 1
          - Pre-increment (++x): Increment, then access
          - Post-increment (x++): Access, then increment
        - Decrement (--): Decrease value by 1
          - Pre-decrement (--x): Decrement, then access
          - Post-decrement (x--): Access, then decrement
        - Exponential (**)
      - Assignment Operators:
        - Assignment (=)
        - Arithmetic Assignment (+=, -=, *=, /=, %=)
      - Comparison Operators (Returns boolean):
        - Greater than (>)
        - Lesser than (<)
        - Greater than or equals to (>=)
        - Lesser than or equals to (<=)
        - Equality operator (==): Equal value
        - Inequality operator (!=): Not equal value
        - Identity operator (===): Equal value + same data type (Strict equality operator)
        - Non-identity operator (!==): Not equal value + same data type
      - Logical Operators (Returns boolean):
        - Logical AND (&&): All TRUE -> TRUE; else FALSE
        - Logical OR (||): One TRUE -> TRUE; if none are TRUE, then FALSE
        - Logic NOT (!): TRUE -> FALSE; FALSE -> TRUE

    - Comments
      - Single line: //
      - Multiple lines: /* */
-->
