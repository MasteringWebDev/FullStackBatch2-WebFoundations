    /*
      # Objects: Collections of key value pairs
        - key (string)
        - values (data type)
        - Syntax
          let obj = {
            key1: value1,
            key2: value2,
            ...
          }

        - Access values using keys
          - Syntax 1: obj.key1
          - Syntax 2: obj['key1']

        - Add/Update values using keys
          - Syntax 1: obj.key1 = value1
          - Syntax 2: obj['key1'] = value1

        - Delete a key
          - 'delete' keyword
          - Syntax: delete obj.key1

        - Properties and Methods (Keys)
          - Properties: Keys holding any value other than functions
          - Methods: Keys holding functions as values

        - Inbuilt object methods:
          - Object.keys(): Returns an array of keys belonging to the object
          - Object.values(): Returns an array of values belonging to the object
          - Object.entries: Returns an array of [key, values] belonging to the object

        - JSON: JavaScript Object Notation
          - JSON.stringify(): Convert JS object to JSON string
          - JSON.parse(): Convert a JSON string to JS object

        - 'this' keyword: Refers to it's immediate parent object
          - Within a method of an object: Refers to the parent object
          - In global scope: Refers to the window object
            - Window object 
              - a.k.a BOM (Browser Object Model)
              - Complete information about the webpage and the browser details
              - Reserved keyword: window

        - Additional notes:
          - Arrays are special type of objects, where keys are numerical
          - Constructors: Create objects of similar type
            - Syntax: let obj = new Constructor()
            - Inbuilt Constructors:
              - Number()
              - String()
              - Boolean()
          - JavaScript is an object-based langauge
          - Wrapper objects for primitive values: JS under the hood, wraps the primitive values with the non-primitive object equivalent
            - Reference: https://medium.com/javascript-refined/the-wrapper-object-400311b29151
          - [object Object]: Objects in HTML document flow without converting it to string using JSON.strigify()

    */
