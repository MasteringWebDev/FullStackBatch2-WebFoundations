  <script>
    /*
      # Declare variables/constants
        - var, let, const
        - ES6: ECMAScript 6 (2015)
          - let, const (Block scope)

        - var: Variable
          - Re-declared ✅
          - Re-assignment ✅
          - Function scope
        - let: Variable
          - Re-declared ❌
          - Re-assignment ✅
          - Block scope
        - const: Constants
          - Re-declared ❌
          - Re-assignment ❌
          - Block scope

      # Scopes: Space where a variable can be accessed
        - Global scope: Variable can be accessed anywhere in the file
        - Function scope: Variable can be accessed within the function
        - Block scope ({}): Variable can be accessed within the block
    */
