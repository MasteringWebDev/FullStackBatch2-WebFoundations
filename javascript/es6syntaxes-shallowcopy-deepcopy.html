    /*
      # ES6 Syntaxes, Shallow copy, Deep copy
        - ES: ECMAScript
        - ES6: JavaScript 6th Edition (2015)
        - Several 'Syntactic Sugar' (minimalist syntaxes) were introduced in this version
        - ES6 is used extensively in modern JS libraries (React, Angular, Vue, etc.)

        - Concepts/Syntaxes:
          1. let and const (Block scope) ***
            - let: Declare variables
            - const: Declare constants

          2. Template literals/strings (``)
            - It starts and end with backticks (`)
            - Supports multi-line strings and expressions
            - Syntax to use variables/expressions within template strings:
              `My name is ${fullName}`

          3. Default parameters
            - Default values can be provided to function parameters
            - Default vales are applied if arguments are not passed for those parameters
            - Example:
              function fun1(a = 0, b = 0) {
                // code
              }
              fun1(10, 20) // a = 10, b = 20
              fun1(10) // a = 10, b = 0
              fun1() // a = 0 , b = 0 

          4. Arrow functions (() => {}) ***
            - Syntactic sugar for anonymous function
            - Syntax:
              let abc = () => {
                // code
              }
            - Single line arrow functions
              - Scenarios:
                1. Function has a single expression (Skip {})
                  const abc = () => {
                    console.log('abc')
                  }
                  const abc = () => console.log('abc')
                2. Function having single return expression (Skip {} and return)
                  const add = (num1, num2) => {
                    return num1 + num2
                  }
                  const add = (num1, num2) => num1 + num2
            - Functions which have 1 parameter (Skip ())
              const square = num => num * num
              const findNoOfChars = str => {
                console.log(str.length)
              }
            
          5. Object property shorthand (obj = { p1, p2 })
            - Whenever the object property name and the name of the variable assigned to it are the same, { key: variable } can be declared as { key }
            - Syntax:
              let firstName = 'John'
              let lastName = 'Doe'
              let student = { firstName, lastName }

          6. Destructuring ({ p1, p2 } = obj)
            - Create variables having the same name as the property name and have the variable value = value of the property
            - Syntax:
              let student = { 
                firstName: 'John', 
                lastName: 'Doe'
              }
              let { firstName, lastName } = student

          7. Spread Operator (...) ***
            - Used to select all elements within arrays/ objects
            - Syntax (Usually used with array [] /object {} brackets)
              [...arr]
              {...obj}

        --------------
        - Non-primitive value assignment: Any changes to a non-primitive value using one variable willl be reflected by the other variable as well because both are pointing to the same non-primitive value in the heap memory

        - Copy for non-primitive values:
          1. Shallow copy
            - First order properties/elements are copied
            - Best for simple arrays and objects
            - Syntax: Using spread operator (...)
          2. Deep copy
            - Complete copy of properties across all levels/orders
            - Best for complex arrays and objects
            - Syntax: JSON.parse(JSON.stringify(obj))
    */
