  <script>
    /*
      # DOM (Document Object Model)
        - Refers to the object representaion of the "HTML document tree"
        - Reserved keyword: document
        - Nodes: Represents individual HTML elements in the DOM tree

        - Properties:
          - body: Refers to the body node of the HTML document
          - head: Refers to the head node of the HTML document
          - title: Refers to the title of the HTML document
          - children: Returns all child nodes of a given node
          - firstElementChild: Returns the first child node of a given node
          - lastElementChild: Returns the last child node of a given node
        - Methods: 
          - getElementById('id') ***: Returns the node which has the specified id
          - getElementsByClassName('class') ***: Returns an HTMLCollection (array of nodes) which have the specified class
          - getElementsByTagName('tag'): Returns an HTMLCollection (array of nodes) which have the specified tag

      # DOM Content Manipulation
        - innerText: Refers to the inner text content of the node (String)
        - innerHTML: Refers to the inner HTML content of the node (String)
          - Similar to innerText but you can also include HTML tags
        - value: Refers to the data entered within the form field node

      # DOM Attribute Manipulation
        - Syntax: node.attribute
        - Exception: 'class' attribute
          - node.classList: Returns a collection of classes assigned to that node
            - node.classList.add('newClass'): Add a new class
            - node.classList.remove('existingClass'): Remove existing class

      # DOM Style Manipulation
        - Single style property
          - node.style.property (property in camelCase)
        - Multiple style properties
          - node.style.cssText = 'property1: value1; property2: value2; ...'

      # DOM Node Manipulation ***
        - document.createElement('tag'): Creates a new tag node
        - node.appendChild(childNode): Appends a child node to the parent node
        - node.append(childNode1, childNode2, ...): Append multiple child nodes to the parent node
        - node.remove(): Remove the specific node from the DOM tree
        

    */

    const productList = document.getElementById('product-list')

    const colDiv = document.createElement('div')

    const cardDiv = document.createElement('div')
