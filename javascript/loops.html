      # Loops: Execute any logic in a repeated basis
        - Terms:
          - Iteration: Individual cycle
          - Condition: Determine whether to proceed or halt
        - Process
          1. In each iteration, condition will be checked
            a. If condition is true, iteration will be processed
            b. Else if condition is false, loop will terminate
          2. After the iteration, increment/decrement the loop variable
        - Parts of loop declaration
          1. Initialization of loop variable
          2. Condition
          3. Increment/Decrement the loop variable

        - Types of loops:
          1. "while" loop
            - Syntax:
              // initialize loop variable
              while(condition) {
                // loop logic
                // increment/decrement loop variable
              }
          2. "do while" loop
            -  Syntax:
              // initialize loop variable
              do {
                // loop logic
                // increment/decrement loop variable
              } while(condition)
          3. "for" loop ***
            - Syntax:
              for(initialize; condition; increment/decrement) {
                // loop logic
              }

    */
