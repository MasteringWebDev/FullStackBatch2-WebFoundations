  <script>
    /*
      # HOFs (Higher Order Functions)
        - A function that:
          - is passed as an argument to another functions (Callback)
          - returns another function (Closure)

      # Callbacks: A function passed as an argument to another function
        - Syntax:
          - Syntax 1:
            func1(func2)
          - Syntax 2:
            func1(function () {
              console.log('Function 2')
            })
            - With arrow functions
              func1(() => {
                console.log('Function 2')
              })

      # Closures ***:
        - Inner function continues to have access to the outer function variables even after the outer function has completed execution
        - In easy words:
          - Closures = [Functions' scope + it's lexical environment]
          - Inner function "remembers" it's lexical environment

    */
