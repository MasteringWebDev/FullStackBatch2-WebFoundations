<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hoisting</title>
</head>
<body>
  <script>
    /*
      # Hoisting ***: Variables and function declarations are moved to the top of the code before execution in JavaScript
        - Access variables and functions before declaration
        - Only declaration is hoisted; Initialization and assignments are not hoisted

        - Temporal Dead Zone (TDZ):
          - let and const declarations are hosited, but they continue to remain in "temporal dead zone" until it is assigned with a value
          - JavaScript is aware of the variable/constant created using let/const, but it cannot be accessed until it has been intialized/declared
          - Cheat code: Only "var" and "function" declarations are hoisted

    */

    // console.log(x) // x can be accessed because it is hoisted

    // var x = 10

    // abc()

    // function abc() {
    //   console.log('abc')
    // }

    // console.log(x) // x cannot be accessed because although it is hoisted, it remains in temporal dead zone
    // let x
    
    // console.log(x)
    // let x = 10
  </script>
</body>
</html>
