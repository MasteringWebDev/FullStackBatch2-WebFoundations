<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Handling</title>
  <style>
    .form-section {
      margin-top: 10px;
    }

    .error-text {
      color: red;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <h1>Job Application Forms</h1>

  <form>
    <div class="form-section">
      <label for="fullname">Full name</label>
      <input type="text" id="fullname" autocomplete="off">
      <div id="fullname-error" class="error-text"></div>
    </div>
    <div class="form-section">
      <label for="email">Email</label>
      <input type="email" id="email" autocomplete="off">
      <div id="email-error" class="error-text"></div>
    </div>
    <div class="form-section">
      Skills
      <input type="checkbox" class="skills" value="HTML" id="skills-HTML">
      <label for="skills-HTML">HTML</label>
      <input type="checkbox" class="skills" value="CSS" id="skills-CSS">
      <label for="skills-CSS">CSS</label>
      <input type="checkbox" class="skills" value="JAVASCRIPT" id="skills-JAVASCRIPT">
      <label for="skills-JAVASCRIPT">JAVASCRIPT</label>
    </div>
    <div class="form-section">
      <label for="role">Role</label>
      <select id="role">
        <option value="NA">Select</option>
        <option value="FED">Frontend Developer</option>
        <option value="BED">Backend Developer</option>
        <option value="FSD">Full Stack Developer</option>
      </select>
    </div>
    <div class="form-section">
      Have you already resigned?
      <input type="radio" name="resigned" class="resigned" value="YES" id="resigned-yes">
      <label for="resigned-yes">Yes</label>
      <input type="radio" name="resigned" class="resigned" value="NO" id="resigned-no">
      <label for="resigned-no">No</label>
    </div>
    <div class="form-section">
      <label for="whyjoinus">Why do you want to join us?</label><br>
      <textarea rows="10" cols="40" id="whyjoinus"></textarea>
    </div>
    <div class="form-section">
      <label for="resume">Resume</label>
      <input type="file" id="resume">
    </div>
    <div class="form-section">
      <button type="reset">Reset</button>
      <button type="button" onclick="handleFormData()">Submit</button>
    </div>
  </form>

  <script>
    function handleFormData() {
      const fullName = document.getElementById('fullname').value
      const email = document.getElementById('email').value

      const skills = document.getElementsByClassName('skills')
      const selectedSkills = Array.from(skills).filter(skill => skill.checked)
      const selectedSkillValues = selectedSkills.map(skillNode => skillNode.value)

      const role = document.getElementById('role').value

      const resigned = document.getElementsByClassName('resigned')
      const selectedResigned = Array.from(resigned).find(option => option.checked)

      const whyjoinus = document.getElementById('whyjoinus').value

      const files = document.getElementById('resume').files

      const userData = {
        fullName,
        email,
        skills: selectedSkillValues,
        role,
        hasResigned: selectedResigned ? selectedResigned.value : 'NA',
        whyjoinus,
        resumeFileName: files[0] ? files[0].name : 'NA'
      }

      console.log('User data collected ✅', userData)

      const result = validateFormData(userData, files)
      if(result) {
        console.log('User data validated and submitted ✅')
      } else {
        console.log('There are some errors in your responses, please correct it ❌')
      }
    }

    /*
      # Validation rules:
        1. Full Name:
          - Should not be empty ✅
          - At least have 3 characters ✅
        2. Email:
          - Should not be empty ✅
          - Should have '@' ✅
          - Should have '.' ✅
          - At least 3 characters before @ ✅
          - At least 2 characters after last . ✅
        3. Skills:
          - At least 1 skill should be selected ✅
        4. Role:
          - A valid selection ✅
        5. Already resigned?
          - A valid selection ✅
        6. Why do you want to join us?
          - Should not be empty ✅
          - At least have 300 characters ✅
        7. Resume
          - A file should be selected ✅
          - File type should be PDF
    */

    function validateFormData(userData, files) {
      resetErrorText()
      let result = true

      const {
        fullName,
        email,
        skills,
        role,
        hasResigned,
        whyjoinus,
        resumeFileName
      } = userData

      /* 1. Full Name: */
      if(!fullName || fullName.length < 3) {
        document.getElementById('fullname').style.border = '0.15em solid red'
        document.getElementById('fullname-error').innerText = 'Invalid fullname.'
        result = false
      }

      /* 2. Email */
      if(!email || !email.includes('@') || !email.includes('.')) {
        document.getElementById('email').style.border = '0.15em solid red'
        document.getElementById('email-error').innerText = 'Invalid email.'
        result = false
      }

      let atCharIndex = email.indexOf('@')
      if(atCharIndex < 3) {
        document.getElementById('email').style.border = '0.15em solid red'
        if(!document.getElementById('email-error').innerText)
          document.getElementById('email-error').innerText = `Invalid email. At least 3 characters before '@' .`
        result = false
      }

      let lastDotIndex = email.lastIndexOf('.')
      let totalChars = email.length
      if(totalChars - lastDotIndex < 3) {
        document.getElementById('email').style.border = '0.15em solid red'
        if(!document.getElementById('email-error').innerText)
          document.getElementById('email-error').innerText = `Invalid email. At least 2 characters after last '.' .`
        result = false
      }

      /* 3. Skills */
      if(!skills.length) {
        console.log('Please select at least one skill.')
        result = false
      }

      /* 4. Role */
      if(role == 'NA') {
        console.log('Please select a valid role.')
        result = false
      }

      /* 5. Already resigned? */
      if(hasResigned == 'NA') {
        console.log(`Please select one option for 'Have you already resigned?'.`)
        result = false
      }

      /* 6. Why do you want to join us? */
      if(!whyjoinus || whyjoinus.length < 300) {
        console.log('Invalid response. At least 300 characers.')
        result = false
      }

      /* 7. Resume */
      if(resumeFileName == 'NA') {
        console.log('File not selected. Please upload a file.')
        result = false
      }

      if(files[0] && files[0].type != 'application/pdf') {
        console.log('Invalid file selected. Only PDF allowed.')
      }

      return result
    }

    function resetErrorText() {
      document.getElementById('fullname').style.border = '0.15em solid black'
      document.getElementById('fullname-error').innerText = ''

      document.getElementById('email').style.border = '0.15em solid black'
      document.getElementById('email-error').innerText = ''
    }
  </script>
</body>
</html>
