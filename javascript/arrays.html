    /*
      # Arrays: Collection of multiple elements
        - Syntax: let array = [element1, element2, ...]
        - Different data type elements can exist within the same array

        - Position vs Index
          - Index = Position - 1
          - Examples:
            P   I
            1   0
            2   1
            3   2
            ... ...
            n   n-1

        - Access a specific element in an array using index
          - Syntax: arr[index]

        - Update a specific element in an array using index
          - Syntax: arr[index] = newElement

        - Iterate an array (using loops)
          for(let i=0; i < arr.length; i++) {
            console.log(arr[i])
          }

        - Properties
          - .length ***: Total number of elements
        - Methods
          - .indexOf() ***: Returns the index of the first occurence of the element in the array, else if not found returns -1
            - .lastIndexOf(): Returns the index of the last occurence of the element in the array, else if not found returns -1
          - includes() ***: Returns true if the element is found in the array, else if not found returns false
          - push(newElement) ***: Adds a new element to the end of the array
            - Returns the updated length of the array
          - pop() ***: Removes the last element from the array
            - Returns the element that was removed
          - unshift(newElement): Adds a new element to the start of the array
            - Returns the updated length of the array
          - shift(): Removes the first element from the array
            - Returns the element that was removed
          - concat(): Merge two or more arrays
            - Returns the merged array
          - slice(startIndex, endIndex) ***: Returns a subarray (Ensure startIndex < endIndex)
            - startIndex, endIndex: startIndex to endIndex - 1
            - startIndex: startIndex till the end of the array
            - No arguments: Complete array
          - reverse(): Reverse the order of array elements
            - Will update the original array, return the reversed array

        
      # Additional note:
        - Arrays to Strings:
          - Array Method: .join()
          - Concatenates elements to form a string and reurns that string
          - Arguments:
            - No argument: Joins elements separated by commas
            - Separator: Joins elements separated by the separator
        - Strings to Arrays:
          - String Method: .split()
          - Split the string into array elements, returns that array
          - Arguments:
            - No argument: Returns an array with single element
            - Empty string: Returns an array with all characters of the string as elements
            - Separator: Returns an array with elements split from the string wherever this separator was found


    */
