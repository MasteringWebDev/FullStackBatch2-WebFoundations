<!--
  # Bootstrap: CSS Framework
    - Most popular CSS framework for building responsive and mobile-first websites
    - Provides a combination of pre-configured components, utilities, and a grid system (classes with style rules)
    - Link: https://getbootstrap.com

    - Keywords:
      - Colors:
        - Primary: Blue
        - Secondary: Gray
        - Success: Green
        - Danger: Red
        - Warning: Yellow
        - Info: Light Blue
        - Light: Light color
        - Dark: Dark color
      - Sizes:
        - sm: Small
        - md: Medium
        - lg: Large
        - xl: Extra large
        - xxl: Extra extra large
      - Sides:
        - t: Top
        - b: Bottom
        - s: Start (left)
        - e: End (right)

    - Components:
      - buttons:
        - btn: Base class for buttons

        - btn-primary: Primary button style (blue)
        - btn-secondary: Secondary button style (gray)
        - btn-success: Success button style (green)
        - btn-danger: Danger button style (red)

        - btn-outline-primary: Primary button with outline style
        - btn-outline-secondary: Secondary button with outline style
        - btn-outline-success: Success button with outline style
        - btn-outline-danger: Danger button with outline style

        - btn-sm: Small button size
        - btn-lg: Large button size

      - navbar:
        - navbar: Base class for navigation bar
        - navbar-expand-lg: Expands the navbar on large screens
        - bg-body-tertiary: Background color for the navbar
        - navbar-brand: Brand/logo link in the navbar
        - navbar-toggler: Button to toggle the navbar on smaller screens
        - collapse: Class to collapse the navbar content
        - navbar-nav: Container for navigation links
        - nav-item: Individual navigation item
        - nav-link: Link inside the navigation item

    - Utilities:
      - Margin (m-*; mt-*, mb-*, ms-*, me-*):
        - m-0: No margin
        - m-1: Small margin
        - m-2: Medium margin
        - m-3: Large margin
        - m-4: Extra large margin
        - m-5: Extra extra large margin
      - Padding (p-*; pt-*, pb-*, ps-*, pe-*):
        - p-0: No padding
        - p-1: Small padding
        - p-2: Medium padding
        - p-3: Large padding
        - p-4: Extra large padding
        - p-5: Extra extra large padding
      - Text alignment (text-*):
        - text-start: Align text to the start (left)
        - text-center: Align text to the center
        - text-end: Align text to the end (right)
      - Background color (bg-*):
        - bg-primary: Primary background color (blue)
        - bg-secondary: Secondary background color (gray)
        - bg-success: Success background color (green)
        - bg-danger: Danger background color (red)
        - bg-warning: Warning background color (yellow)
        - bg-info: Info background color (light blue)
        - bg-light: Light background color
        - bg-dark: Dark background color
      - Display (d-*):
        - d-none: Hide element
        - d-inline: Display element inline
        - d-block: Display element as block
        - d-flex: Display element as flex container
        - d-grid: Display element as grid container
-->
