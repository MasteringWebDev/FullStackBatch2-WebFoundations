<!DOCTYPE html>
<html lang="en">
<head>
	<title>Specificity</title>
	<style>
		#box {
			width: 200px;
			height: 200px;
			border: 1px solid black;
			background-color: orange;
		}

		.boxes {
			background-color: green;
		}

		div {
			background-color: blue;
		}

		* {
			background-color: red;
		}
	</style>
</head>
<body>
  <div id="box" class="boxes"></div>
</body>
</html>

<!--
  # Specificity:
    - Specificity is a set of rules that browsers use to determine which CSS rule to apply when multiple rules could apply to the same element

		- Inline > Internal, External
		- Latest value for the style property gets applied
		- Priority order of selectors:
			1. ID Selector (highest priority)
			2. Class Selector
			3. Element Selector
			4. Universal Selector (least priority)

		- !important: Overrides all other declarations, but should be used rarely as it can make debugging difficult

-->
