<!--
  # Flexbox ***
    - Organize items in one direction (horizontally or vertically)
    - Properties:
      - Container
        - display ***: flex (Container follows flexbox layout)
        - flex-direction ***: Set the direction of the items
          - row (default): Main axis is horizontal, cross axis is vertical
          - column: Main axis is vertical, cross axis is horizontal
        - justify-content ***: Align items across 'main axis'
          - start: Start of the container (default)
          - end: End of the container
          - center: Center of the container
          - space-around: Equal space around items
          - space-evenly: Equal space between items
          - space-between: Equal space between items, but no space at the edges
        - align-items ***: Align items across 'cross axis'
          - start: Start of the container (default)
          - end: End of the container
          - center: Center of the container
        - gap: Set the gap between items
        - flex-wrap: Allow items to wrap to the next line
          - nowrap (default): Items will not wrap
          - wrap: Items will wrap to the next line
      - Items:
        - order: Set the order of the items (default is 0)
        - flex-grow: Set the growth factor of the items (default is 0)
-->
