<!--
  # Display ***
    - Set the nature of HTML element
    - Value:
      - block: Make a specific element 'block' in nature
      - inline: Make a specific element 'inline' in nature (width/height properties cannot be applied to inline elements)
      - inline-block: Similar to inline + width/height properties can be applied
      - none: Hide a specific element

  # Additional note:
    - Hide any element
      - display: none (Remove the element + space)
      - visibility: hidden (Remove the element, but keep the space)
-->
