<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Strength Checker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div class="container mt-5">
    <h1 class="display-5 text-center">Password Strength Checker</h1>
    <ul class="list-group list-group-flush mt-5 gap-2" id="box">
      <li class="list-group-item d-flex justify-content-between align-items-center fs-4 m-auto" style="width: 800px;">
        <span>At least 8 characters</span>
        <img src="" width="50" id="rule-1-result">
      </li>
      <li class="list-group-item d-flex justify-content-between align-items-center fs-4 m-auto" style="width: 800px;">
        <span>At least one lowercase character</span>
        <img src="" width="50" id="rule-2-result">
      </li>
      <li class="list-group-item d-flex justify-content-between align-items-center fs-4 m-auto" style="width: 800px;">
        <span>At least one uppercase character</span>
        <img src="" width="50" id="rule-3-result">
      </li>
      <li class="list-group-item d-flex justify-content-between align-items-center fs-4 m-auto" style="width: 800px;">
        <span>At least one number</span>
        <img src="" width="50" id="rule-4-result">
      </li>
      <li class="list-group-item d-flex justify-content-between align-items-center fs-4 m-auto" style="width: 800px;">
        <span>At least one special character (!, @, #)</span>
        <img src="" width="50" id="rule-5-result">
      </li>
      <li class="list-group-item d-flex justify-content-between align-items-center fs-4 m-auto" style="width: 800px;">
        <span>Should not contain the following: 'test', 'password'</span>
        <img src="" width="50" id="rule-6-result">
      </li>

      <p class="lead text-center mt-5 fs-1" id="score-display"></p>
    </ul>
  </div>


  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
  <script src="index.js"></script>
</body>
</html>
